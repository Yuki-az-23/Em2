# The art exhibit (exhibit/, ADR-016). Runs only when the exhibit changes.
# Keep the job list in step with .forgejo/workflows/exhibit.yml (ADR-010).
name: exhibit
on:
  pull_request:
    paths: ['exhibit/**', '.github/workflows/exhibit.yml']
  push:
    branches: [main]
    paths: ['exhibit/**', '.github/workflows/exhibit.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: exhibit

jobs:
  web:
    name: exhibit lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-audit --no-fund
      - run: npx eslint .
      - run: npx vitest run
      - run: npm --workspace worker test
      - run: npx vite build
        env:
          VITE_SUPABASE_URL: https://example.invalid
          VITE_SUPABASE_ANON_KEY: ci

  schema:
    name: exhibit schema on postgres 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hermes
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: apply schema.sql to an empty database
        run: psql -h localhost -U postgres -d hermes -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
      - name: run smoke.sql
        run: psql -h localhost -U postgres -d hermes -v ON_ERROR_STOP=1 -q -f supabase/smoke.sql
      - name: schema.sql is idempotent (applies twice)
        run: psql -h localhost -U postgres -d hermes -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
      - name: the demo compose file parses
        run: docker compose -f demo/docker-compose.yml config --quiet

  e2e:
    name: exhibit end to end (scenario and browser)
    # Pinned: Playwright 1.56.1 (matching the Chromium build used in development)
    # cannot install browser dependencies on ubuntu-latest, which is now 26.04.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hermes
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DEMO_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hermes
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-audit --no-fund
      - name: scenario (door, consent, relay, card, inertia, withdrawal, rate limit)
        run: npm run demo:check
      - run: npx playwright install --with-deps chromium
      - name: browser (door, simulator, wall)
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: exhibit/playwright-report
          retention-days: 7
